<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STACKLY - Sign Up</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core CSS (for variables/fonts) -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- Page Specific CSS -->
    <link rel="stylesheet" href="css/sign_up.css">
</head>
<body>

    <div class="split-layout">
        <!-- Left Panel -->
        <div class="split-left">
            <div class="split-left-content">
                <div class="logo-text">STACKLY</div>
                <h3>Join us today!</h3>
                <p>Create an account to start managing your agricultural journey</p>
                <a href="index.html" class="btn-back-home">BACK TO HOME</a>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="split-right">
            <div class="signup-form-wrapper">
                <div class="form-header">
                    <h2>Create an account</h2>
                    <p>Already have an account? <a href="login.html">Login</a></p>
                </div>

                <form id="signupForm" action="#">
                    <!-- Role Selection -->
                    <div class="form-group">
                        <label for="role">Register as</label>
                        <select id="role" class="form-select">
                            <option value="user">User</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <!-- Name Fields -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="first_name">First Name</label>
                            <input type="text" id="first_name" class="form-control" placeholder="First Name" required>
                        </div>
                        <div class="form-group">
                            <label for="last_name">Last Name</label>
                            <input type="text" id="last_name" class="form-control" placeholder="Last Name" required>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter Your Email" required>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Create a Password" required>
                    </div>

                    <!-- Terms -->
                    <div class="terms-checkbox">
                        <input type="checkbox" id="terms" required>
                        <label for="terms" style="font-weight: 400;">
                            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
                        </label>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn-signup">CREATE ACCOUNT</button>

                    <!-- Divider -->
                    <div class="divider">Or register with</div>

                    <!-- Social Logins -->
                    <div class="social-login">
                        <a href="#" class="btn-social">Facebook</a>
                        <a href="#" class="btn-social">Google</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts for preloader -->
    <script src="js/loading.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
